<main style="text-align: center; margin-top: 100px; font-family: sans-serif;">
  <h1>Amigo Secreto 🎁</h1>
  <p>Organiza tu intercambio de regalos fácilmente.</p>
  
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px;">
    <!-- Las variables #emailInput y #passInput nos dejan capturar el texto sin importar más módulos -->
    <input type="email" #emailInput placeholder="Tu correo" style="padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px;">
    <input type="password" #passInput placeholder="Tu contraseña" style="padding: 10px; width: 250px; border: 1px solid #ccc; border-radius: 4px;">

    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <button 
        (click)="login(emailInput.value, passInput.value)" 
        style="padding: 10px 20px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 5px;">
        Ingresar
      </button>
      
      <button 
        (click)="registrar(emailInput.value, passInput.value)" 
        style="padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px;">
        Registrarse
      </button>
    </div>
  </div>
</main>
