<main
  style="
    max-width: 420px;
    margin: 60px auto;
    padding: 20px;
    font-family: sans-serif;
  "
>
  <h1>Amigo Secreto 🎁</h1>
  <p>Organiza tu intercambio de regalos.</p>

  <h2>{{ modoRegistro() ? 'Crear cuenta' : 'Iniciar sesión' }}</h2>

  <form (ngSubmit)="enviarFormulario()">
    <fieldset
      [disabled]="procesando()"
      style="border: 0; padding: 0; margin: 0; min-width: 0;"
    >
      @if (modoRegistro()) {
        <div style="margin-bottom: 16px;">
          <label for="apodo">Tu apodo</label>

          <input
            id="apodo"
            name="apodo"
            type="text"
            [(ngModel)]="apodo"
            required
            maxlength="40"
            autocomplete="nickname"
            placeholder="Así te verán tus amigos"
            style="box-sizing: border-box; width: 100%; padding: 10px;"
          >
        </div>
      }

      <div style="margin-bottom: 16px;">
        <label for="email">Correo electrónico</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          style="box-sizing: border-box; width: 100%; padding: 10px;"
        >
      </div>

      <div style="margin-bottom: 16px;">
        <label for="password">Contraseña</label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          [attr.autocomplete]="
            modoRegistro() ? 'new-password' : 'current-password'
          "
          style="box-sizing: border-box; width: 100%; padding: 10px;"
        >

        @if (modoRegistro()) {
          <small>Usa al menos 8 caracteres.</small>
        }
      </div>

      <button type="submit" [disabled]="procesando()">
        {{
          procesando()
            ? 'Procesando…'
            : modoRegistro()
              ? 'Crear cuenta'
              : 'Ingresar'
        }}
      </button>

      <button
        type="button"
        [disabled]="procesando()"
        (click)="cambiarModo()"
        style="margin-top: 12px;"
      >
        {{
          modoRegistro()
            ? 'Ya tengo cuenta'
            : 'Quiero registrarme'
        }}
      </button>
    </fieldset>
    @if (!modoRegistro()) {
  <p>
    <button
      type="button"
      [disabled]="procesando()"
      (click)="irARecuperarClave()"
    >
      Olvidé mi contraseña
    </button>
  </p>
}
  </form>

  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }

  <p role="status">{{ mensaje() }}</p>
</main>
