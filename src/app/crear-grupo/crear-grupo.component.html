<main class="page-shell page-shell--narrow">
  <section class="card">
    <div class="brand-mark" aria-hidden="true">✨</div>
    <p class="eyebrow">Nuevo intercambio</p>
    <h1>Crear grupo 🎁</h1>
    <p class="lead">Define los detalles. Podrás invitar participantes después.</p>
    <div class="form-stack">
      <div class="field">
        <label for="nombre">Nombre del grupo</label>
        <input
          id="nombre"
          type="text"
          #nombreInput
          maxlength="80"
          placeholder="Ej. Amigos de la universidad"
        />
      </div>
      <div class="field">
        <label for="descripcion">Descripción o reglas</label>
        <textarea
          id="descripcion"
          #descInput
          maxlength="2000"
          rows="4"
          placeholder="Cuenta cómo será el intercambio"
        ></textarea>
        <small>Opcional, hasta 2000 caracteres.</small>
      </div>
      <div class="field">
        <label for="monto">Monto mínimo del regalo (S/)</label>
        <input id="monto" type="number" #montoInput value="50" min="0.01" step="0.01" />
        <small>El costo de envío se paga aparte.</small>
      </div>
      <div class="field">
        <label for="fecha">Fecha de entrega</label>
        <input id="fecha" type="date" #fechaInput />
        <small>Opcional.</small>
      </div>
      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }
      <div class="actions">
        <button
          type="button"
          [disabled]="guardando()"
          (click)="
            guardarGrupo(nombreInput.value, descInput.value, montoInput.value, fechaInput.value)
          "
        >
          {{ guardando() ? 'Guardando…' : 'Crear grupo' }}
        </button>
        <button class="btn-secondary" type="button" [disabled]="guardando()" (click)="cancelar()">
          Cancelar
        </button>
      </div>
    </div>
  </section>
</main>
