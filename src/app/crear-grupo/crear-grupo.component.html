<div style="max-width: 500px; margin: 40px auto; font-family: sans-serif; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
  <h2>Crear nuevo grupo 🎁</h2>
  <p>Configura los detalles del intercambio.</p>

  <div style="display: flex; flex-direction: column; gap: 15px;">
    <div>
      <label for="nombre">Nombre del grupo (*)</label>
      <input
        id="nombre"
        type="text"
        #nombreInput
        maxlength="80"
        placeholder="Ej. Grupo de amigos"
        style="box-sizing: border-box; width: 100%; padding: 10px;"
      >
    </div>

    <div>
      <label for="descripcion">Descripción / reglas</label>
      <textarea
        id="descripcion"
        #descInput
        maxlength="2000"
        placeholder="Escribe las reglas del intercambio"
        style="box-sizing: border-box; width: 100%; padding: 10px; min-height: 80px;"
      ></textarea>
    </div>

    <div>
      <label for="monto">Monto mínimo del regalo (S/)</label>
      <input
        id="monto"
        type="number"
        #montoInput
        value="50"
        min="0.01"
        step="0.01"
        style="box-sizing: border-box; width: 100%; padding: 10px;"
      >
      <small>El costo de envío se paga aparte.</small>
    </div>

    <div>
      <label for="fecha">Fecha de entrega (opcional)</label>
      <input
        id="fecha"
        type="date"
        #fechaInput
        style="box-sizing: border-box; width: 100%; padding: 10px;"
      >
    </div>

    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }

    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button
        type="button"
        [disabled]="guardando()"
        (click)="guardarGrupo(
          nombreInput.value,
          descInput.value,
          montoInput.value,
          fechaInput.value
        )"
      >
        {{ guardando() ? 'Guardando…' : 'Guardar grupo' }}
      </button>

      <button
        type="button"
        [disabled]="guardando()"
        (click)="cancelar()"
      >
        Cancelar
      </button>
    </div>
  </div>
</div>
